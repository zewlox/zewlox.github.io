<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öznur için özel bir sayfa <3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500&display=swap');

        :root {
            --bg-color: #fff0f3;
            --accent-color: #ff4d6d;
            --text-color: #594d5b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        /* Arka Plan Kalp Yağmuru Animasyonu */
        .heart-particle {
            position: absolute;
            top: -10%;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            color: rgba(255, 77, 109, 0.15);
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 1.5rem;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.1);
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255, 77, 109, 0.2);
            backdrop-filter: blur(5px);
        }

        .name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            color: var(--accent-color);
            margin: 0;
            line-height: 1.2;
        }

        .line {
            width: 40px;
            height: 3px;
            background: var(--accent-color);
            margin: 1.5rem auto;
            border-radius: 2px;
            opacity: 0.6;
        }

        .typing-container {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #typewriter {
            font-size: clamp(1.1rem, 4.5vw, 1.6rem);
            font-weight: 500;
            color: var(--text-color);
            display: inline-block;
            line-height: 1.4;
            padding: 0 10px;
        }

        #typewriter::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: var(--accent-color);
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .lang-label {
            margin-top: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b1a7b5;
            font-weight: 500;
        }

        .pulse-heart {
            font-size: 2rem;
            color: var(--accent-color);
            margin-top: 1.5rem;
            animation: heartbeat 1.2s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Mobil Optimizasyon */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="name">Öznur</h1>
        <div class="line"></div>
        
        <div class="typing-container">
            <div id="typewriter"></div>
            <div id="language" class="lang-label">Hazırlanıyor...</div>
        </div>

        <div class="pulse-heart">❤</div>
    </div>

    <script>
        // Google Translate tabanlı kapsamlı dil listesi
        const translations = [
            { t: "Seni Seviyorum", l: "Türkçe" },
            { t: "I Love You", l: "English" },
            { t: "Je t'aime", l: "Français" },
            { t: "Ich liebe dich", l: "Deutsch" },
            { t: "Ti amo", l: "Italiano" },
            { t: "Te amo", l: "Español" },
            { t: "Eu te amo", l: "Português" },
            { t: "Ik hou van jou", l: "Nederlands" },
            { t: "Ya tebya lyublyu", l: "Русский" },
            { t: "Wo ai ni", l: "中文 (Çince)" },
            { t: "Aishiteru", l: "日本語 (Japonca)" },
            { t: "Saranghae", l: "한국어 (Korece)" },
            { t: "Ana behibek", l: "العربية (Arapça)" },
            { t: "S'agapo", l: "Ελληνικά (Yunanca)" },
            { t: "Main tumse pyar karta hoon", l: "Hindi" },
            { t: "Naku penda", l: "Swahili" },
            { t: "Jeg elsker dig", l: "Dansk" },
            { t: "Minä rakastan sinua", l: "Suomi" },
            { t: "Jag älskar dig", l: "Svenska" },
            { t: "Kocham Cię", l: "Polski" },
            { t: "Te iubesc", l: "Română" },
            { t: "Szeretlek", l: "Magyar" },
            { t: "Miluji tě", l: "Čeština" },
            { t: "Volim te", l: "Hrvatski" },
            { t: "Mahal kita", l: "Tagalog" },
            { t: "Aku cinta kamu", l: "Indonesian" },
            { t: "Chan rak khun", l: "Thai" },
            { t: "Anh yêu em", l: "Tiếng Việt" },
            { t: "Ani ohev otach", l: "עברית (İbranice)" },
            { t: "Ami tomake bhalobashi", l: "Bengali" },
            { t: "Obicham te", l: "Български" },
            { t: "Ech hun dech gär", l: "Lëtzebuergesch" },
            { t: "T'estimo", l: "Català" },
            { t: "Ez te hezdikhem", l: "Kurdish" },
            { t: "Meni seni sevaman", l: "Uzbek" },
            { t: "Men seni süyemin", l: "Kazakh" },
            { t: "Maite zaitut", l: "Basque" },
            { t: "S'ayapo", l: "Cypriot" },
            { t: "Pelim te", l: "Montenegrin" },
            { t: "Rwy'n dy garu di", l: "Welsh" },
            { t: "Tha gaol agam ort", l: "Scots Gaelic" },
            { t: "Bi chamd khairtai", l: "Mongolian" },
            { t: "M'bi fe", l: "Bambara" },
            { t: "Inu nibehe", l: "Hausa" },
            { t: "Kuv hlub koj", l: "Hmong" },
            { t: "Te sakam", l: "Macedonian" },
            { t: "Volim te", l: "Serbian" },
            { t: "Ljubim te", l: "Slovenian" },
            { t: "Askam", l: "Azerbaijani" },
            { t: "Ahu t'u", l: "Armenian" },
            { t: "Me shen miqvarxar", l: "Georgian" },
            { t: "Es tevi milu", l: "Latvian" },
            { t: "As tave myliu", l: "Lithuanian" },
            { t: "Ma armastan sind", l: "Estonian" },
            { t: "Eg elski teg", l: "Faroese" },
            { t: "Apre de t'm", l: "Haitian Creole" },
            { t: "Mi stimabo", l: "Papiamento" },
            { t: "S'ayapo", l: "Albanian" },
            { t: "Ke a go rata", l: "Tswana" },
            { t: "Ndiyakuthanda", l: "Xhosa" },
            { t: "Ngiyakuthanda", l: "Zulu" },
            { t: "Kuv hlub koj", l: "Miao" },
            { t: "Ou te alofa ia te oe", l: "Samoan" },
            { t: "Ofa 'atu", l: "Tongan" },
            { t: "Aloha wau iā 'oe", l: "Hawaiian" },
            { t: "Mimi nakupenda", l: "Swahili" },
            { t: "S'ayapo", l: "Afrikaans" },
            { t: "Inikunda", l: "Kirundi" },
            { t: "Nigukunda", l: "Kinyarwanda" },
            { t: "Kasmari", l: "Esperanto" }
        ];

        const typewriterEl = document.getElementById('typewriter');
        const languageEl = document.getElementById('language');
        
        let currentIdx = 0;
        let charIdx = 0;
        let isDeleting = false;
        let typingSpeed = 100;

        function type() {
            const currentObj = translations[currentIdx];
            // İsmi mesajın sonuna ekliyoruz
            const fullText = currentObj.t + " Öznur";
            
            if (isDeleting) {
                typewriterEl.textContent = fullText.substring(0, charIdx - 1);
                charIdx--;
                typingSpeed = 40;
            } else {
                typewriterEl.textContent = fullText.substring(0, charIdx + 1);
                charIdx++;
                typingSpeed = 100;
            }

            languageEl.textContent = currentObj.l;

            // Yazma tamamlandığında bekle
            if (!isDeleting && charIdx === fullText.length) {
                isDeleting = true;
                typingSpeed = 2500; 
            } 
            // Silme tamamlandığında yeni dile geç
            else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                currentIdx = (currentIdx + 1) % translations.length;
                typingSpeed = 400;
            }

            setTimeout(type, typingSpeed);
        }

        // Arka planda uçuşan kalpler
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 18 + 8 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.opacity = Math.random() * 0.3 + 0.1;
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }

        // Sayfa yüklendiğinde başlat
        window.onload = () => {
            type();
            setInterval(createHeart, 350);
        };
    </script>
</body>
</html>
